<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="杭州电子科技大学卓越学院 · 未来企业家班 · 经管类课程学习站：29 门课程的知识点讲义、分章练习、模拟套卷、公式卡片">
  <title>未来企业家班 · 学习站</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='22' rx='6' fill='%23F5B942'/%3E%3Ccircle cx='11' cy='15' r='2.6' fill='%23E08A2E'/%3E%3Ccircle cx='19' cy='20' r='2.6' fill='%23E08A2E'/%3E%3Ccircle cx='22' cy='12' r='1.8' fill='%23E08A2E'/%3E%3C/svg%3E">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-emoji" aria-hidden="true">🧀</span>
        <div class="brand-text">
          <span class="brand-name">未来企业家班学习站</span>
          <span class="brand-sub">杭电卓越学院 · 经管类</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="themeBtn" class="icon-btn" type="button" title="切换深浅色主题" aria-label="切换主题">🌙</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== 首页视图 ===== -->
    <div id="home" class="view">
      <section class="hero">
        <h1 class="hero-title">🍯 今天也要加油学</h1>
        <p class="hero-sub">29 门课程 · 知识点讲义 · 分章练习 · 模拟套卷 · 公式卡片，一处搞定</p>
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="searchInput" class="search-input" type="search" placeholder="搜索课程、知识点、关键词…" autocomplete="off">
        </div>
        <div class="cat-pills" id="catPills" role="tablist" aria-label="课程分类筛选"></div>
      </section>

      <div class="course-grid" id="courseGrid"></div>

      <div class="empty-tip" id="searchEmpty" hidden>没有找到相关课程 🥲 换个关键词试试</div>
    </div>

    <!-- ===== 课程详情视图 ===== -->
    <div id="viewCourse" class="view" hidden></div>
  </main>

  <footer class="footer">
    <p>课程设置依据杭州电子科技大学卓越学院经管类实验班公开培养方案整理（数理编程、经管核心、思政通识、成长通识、创业特色五大类），教材为公开渠道常用教材参考，习题为学习站自编练习；以教务系统最新版培养方案与课堂要求为准。</p>
  </footer>

  <button id="backTop" class="backtop" type="button" title="回到顶部" aria-label="回到顶部">↑</button>

  <script src="data/courses.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
