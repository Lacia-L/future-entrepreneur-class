<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="杭州电子科技大学卓越学院 · 未来企业家班 · 经管类在修 36 门课程：学习通真实章节大纲、三段式知识点讲解、分章练习、公式卡片">
  <title>未来企业家班 · 学习站</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='22' rx='6' fill='%23F5B942'/%3E%3Ccircle cx='11' cy='15' r='2.6' fill='%23E08A2E'/%3E%3Ccircle cx='19' cy='20' r='2.6' fill='%23E08A2E'/%3E%3Ccircle cx='22' cy='12' r='1.8' fill='%23E08A2E'/%3E%3C/svg%3E">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-emoji" aria-hidden="true">🧀</span>
        <div class="brand-text">
          <span class="brand-name">未来企业家班学习站</span>
          <span class="brand-sub">杭电卓越学院 · 经管类</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="themeBtn" class="icon-btn" type="button" title="切换深浅色主题" aria-label="切换主题">🌙</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== 首页视图 ===== -->
    <div id="home" class="view">
      <section class="hero">
        <h1 class="hero-title">🍯 今天也要加油学</h1>
        <p class="hero-sub">36 门学习通在修课程 + 32 门通用参考课 · 真实章节大纲 · 官方定义+通俗理解+举例 · 分章练习 · 错题变式 · 公式卡片</p>
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="searchInput" class="search-input" type="search" placeholder="搜索课程、知识点、关键词…" autocomplete="off">
        </div>
        <div class="cat-pills" id="catPills" role="tablist" aria-label="课程分类筛选"></div>
      </section>

      <div class="course-grid" id="courseGrid"></div>

      <div class="empty-tip" id="searchEmpty" hidden>没有找到相关课程 🥲 换个关键词试试</div>
    </div>

    <!-- ===== 课程详情视图 ===== -->
    <div id="viewCourse" class="view" hidden></div>
  </main>

  <footer class="footer">
    <p>课程清单与章节大纲来自本人学习通（杭州电子科技大学泛雅）实际在修课程页，按 2026-11-12 抓取；部分课程任课教师未在平台建章节，页面已如实标注。知识点讲解与练习为学习站自编，教材以任课教师指定为准。</p>
  </footer>

  <button id="backTop" class="backtop" type="button" title="回到顶部" aria-label="回到顶部">↑</button>

  <script src="data/courses.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
